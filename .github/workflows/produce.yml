name: Produce YouTube cut
# Ops fires this when staff approve a proposal (event "produce") or change a thumbnail ("thumb").
on:
  repository_dispatch:
    types: [produce, thumb]
  workflow_dispatch:
    inputs:
      vimeo_id: { required: true }
      proposal_id: { required: false }
      teacher: { required: false }
      dry_run: { description: "Test mode (skip Ops)", type: boolean, default: false }
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency: { group: "produce-${{ github.event.client_payload.vimeo_id || inputs.vimeo_id }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install -r requirements.txt
          pip uninstall -y opencv-python opencv-contrib-python opencv-python-headless
          pip install opencv-python-headless
      - name: Run
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPS_PIPELINE_SECRET: ${{ secrets.OPS_PIPELINE_SECRET }}
          OPS_URL: ${{ vars.OPS_URL }}
          VIMEO_QUEUE_FOLDER_ID: ${{ vars.VIMEO_QUEUE_FOLDER_ID }}
          P: ${{ toJson(github.event.client_payload) }}
          VID: ${{ github.event.client_payload.vimeo_id || inputs.vimeo_id }}
          PID: ${{ github.event.client_payload.proposal_id || inputs.proposal_id }}
          TEACHER: ${{ github.event.client_payload.teacher || inputs.teacher }}
        run: |
          ARGS=(--vimeo-id "$VID")
          [ -n "$PID" ] && ARGS+=(--proposal-id "$PID")
          [ -n "$TEACHER" ] && ARGS+=(--teacher "$TEACHER")
          for k in series start end headline accent; do
            v=$(echo "$P" | python -c "import sys,json;d=json.load(sys.stdin) or {};print(d.get('$k') or '')")
            [ -n "$v" ] && ARGS+=(--$k "$v")
          done
          if [ "${{ github.event.action }}" = "thumb" ]; then
            ARGS+=(--thumb-only "${{ github.event.client_payload.cut_id }}")
          fi
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          python pipeline/produce.py "${ARGS[@]}"
